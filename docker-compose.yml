services:
  fe-app:
    image: fe-container-2:second
    ports:
      - 80:80
    depends_on:
      nest-app:
        condition: service_healthy   # 等 NestJS 健康后再启动，避免启动竞态
    networks:
      - common-network

  nest-app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    env_file:
      - src/.env
    depends_on:
      mysql-container:
        condition: service_healthy
      redis-container:
        condition: service_started
    # ports:
    #   - "3005:3005"                # 容器间走内部网络，无需发布端口
    networks:
      - common-network
    healthcheck:                    # 新增：供 fe-app 的 service_healthy 使用
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s             # 给 NestJS 启动留足时间

  mysql-container:
    image: mysql
    volumes:
      - /Users/zhaihonglian/baiyunfei/white/mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: meeting_room_booking_system
      MYSQL_ROOT_PASSWORD: "123456"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - common-network

  redis-container:
    image: redis
    volumes:
      - /Users/zhaihonglian/baiyunfei/white/redis-volume:/data
    networks:
      - common-network

networks:
  common-network:
    driver: bridge